name: Windows tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . "pytest>=8,<10"
      - run: python -m pytest -q -p no:cacheprovider
      - name: Run the finite example
        run: |
          python -m examples.run_finite_demo workspaces/ci-finite-demo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ai4math --workspace workspaces/ci-finite-demo audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ai4math --workspace workspaces/ci-finite-demo delivery-check
