[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4math"
version = "0.7.0"
description = "Evidence-aware mathematical research workbench with bounded execution and review"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools]
packages = ["ai4math"]

[tool.setuptools.package-data]
ai4math = ["academic_seed.json"]

[project.scripts]
ai4math = "ai4math.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
